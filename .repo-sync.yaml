# .repo-sync.yaml — repo-sync configuration for ha-harmony-ng
#
# This file was generated by `repo-sync scaffold`.
# Customize the vars section for your integration, then run:
#   python repo-sync.py sync <path-to-your-repo>

template:
  owner: alexdelprete
  repo: ha-integration-template
  branch: main

vars:
  # ── Identity ──
  repo_name: ha-harmony-ng
  integration_name: Harmony NG
  component_dir: harmony_ng
  domain: harmony_ng
  default_branch: main
  dev_alias: harmonyng                # devbox: <alias>.code / <alias>.hadev hostnames
  dev_host_port: ""
  dev_autostart_hass: false

  # ── 4noks workaround ──
  needs_symlink: false
  python_import_name: ""

  # ── HA/HACS ──
  ha_min_version: "2026.11.0"
  hide_default_branch: false
  ignore_brands: true

  # ── Workflow tuning ──
  jsonlint_flags: ""

  # ── Dependabot ──
  dependabot_interval: weekly
  dependabot_time: ""
  dependabot_timezone: ""

  # ── Pyproject tools tuning ──
  include_mypy: false
  ruff_extend_exclude: []
  ruff_lint_extra_ignores: []
  ruff_lint_extra_perfile_ignores: {}
  ruff_tests_extra_ignores: []

  # ── Extras ──
  gitignore_extra: []
  # Raw Docker --mount strings appended to the devcontainer mounts.
  # harmony-ng firmware clone (read-write) and private firmware notes (read-only).
  devcontainer_extra_mounts:
    - "source=${localEnv:USERPROFILE:/home/alexdelprete}/dev/harmony-ng,target=/home/vscode/dev/harmony-ng,type=bind,consistency=cached"
    - "source=${localEnv:USERPROFILE:/home/alexdelprete}/dev/harmony-ng-data,target=/home/vscode/dev/harmony-ng-data,type=bind,consistency=cached,readonly"
  bug_extra_fields: []
  config_extra_links: []

  # ── Dev dependencies ──
  # Integration-specific packages appended to the shared dev extra / dev group
  # that repo-sync renders into pyproject.toml.
  dev_extra_requirements: []

copy_files:
  - .gitattributes
  - .pymarkdownlint.json
  - .python-version
  - Dockerfile.dev
  - .github/workflows/dbautomerge.yml
  - .github/FUNDING.yml
  - LICENSE
  - .vscode/launch.json
  - .vscode/tasks.json

template_files:
  - .github/workflows/lint.yml
  - .github/workflows/test.yml
  - .github/workflows/validate.yml
  - .github/workflows/release.yml
  - .github/dependabot.yml
  - .github/ISSUE_TEMPLATE/bug.yml
  - .github/ISSUE_TEMPLATE/feature_request.yml
  - .github/ISSUE_TEMPLATE/config.yml
  - .pre-commit-config.yaml
  - hacs.json
  - .gitignore
  - .devcontainer.json
  - docs/releases/README.md
  - CONTRIBUTING.md
  - scripts/develop
  - config/configuration.yaml

marker_files:
  CLAUDE.md:
    - template: CLAUDE_SHARED.md.j2
      begin: "<!-- BEGIN SHARED:repo-sync -->"
      end: "<!-- END SHARED:repo-sync -->"
  README.md:
    - template: README_BADGES.md.j2
      begin: "<!-- BEGIN SHARED:repo-sync:badges -->"
      end: "<!-- END SHARED:repo-sync:badges -->"
    - template: README_INSTALLATION.md.j2
      begin: "<!-- BEGIN SHARED:repo-sync:installation -->"
      end: "<!-- END SHARED:repo-sync:installation -->"
    - template: README_CONTRIBUTING.md.j2
      begin: "<!-- BEGIN SHARED:repo-sync:contributing -->"
      end: "<!-- END SHARED:repo-sync:contributing -->"
    - template: README_LICENSE.md.j2
      begin: "<!-- BEGIN SHARED:repo-sync:license -->"
      end: "<!-- END SHARED:repo-sync:license -->"
  pyproject.toml:
    - template: PYPROJECT_TOOLS.toml.j2
      begin: "# <!-- BEGIN SHARED:repo-sync -->"
      end: "# <!-- END SHARED:repo-sync -->"
