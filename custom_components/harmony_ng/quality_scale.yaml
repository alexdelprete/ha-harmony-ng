# Home Assistant Quality Scale
# https://contributors.home-assistant.io/docs/core/integration-quality-scale/
#
# Hassfest does not validate this file for custom integrations: it tracks the
# rules. The tier declared in manifest.json ("quality_scale") is the highest
# one with every rule done or exempt. Every rule is done or exempt since the
# Hub's firmware announces itself over mDNS (firmware milestone 2): platinum.
rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: No polling. The Hub pushes every change over the WebSocket; update_interval is None.
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: >-
      pyharmonyng is vendored inside the integration until its PyPI release;
      it has no other dependency than aiohttp.
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: >-
      Remotes (keyed by unit id, or Hub id and slot), Bluetooth hosts and configured devices
      get their devices and entities on the update that reports them, also a remote swapped
      into an occupied slot.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: done
    comment: >-
      Remotes, Bluetooth hosts, configured devices and commands the Hub no longer reports are
      removed with their entities, on the update and once after setup; only from a complete
      report (RF and Bluetooth running, a fetched inventory). async_remove_config_entry_device
      stays as the fallback.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
